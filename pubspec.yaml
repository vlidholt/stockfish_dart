name: stockfish_dart
description: >-
  Stockfish 19 chess engine for Dart on macOS, Windows and Linux, embedded
  through FFI with a typed, documented API covering every UCI command and
  option. No Flutter required.
version: 0.1.0
repository: https://github.com/vlidholt/stockfish_dart
issue_tracker: https://github.com/vlidholt/stockfish_dart/issues
topics:
  - chess
  - stockfish
  - uci
  - engine
  - ffi

environment:
  sdk: ^3.10.0

platforms:
  linux:
  macos:
  windows:

executables:
  stockfish_dart: setup
dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  meta: ^1.19.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
